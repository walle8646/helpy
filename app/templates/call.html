{% extends "base.html" %}

{% block title %}Consulenza in Corso - Helpy{% endblock %}

{% block content %}
<style>
    /* Nascondi l'header */
    .navbar {
        display: none !important;
    }
    
    /* Adatta il container per fullscreen senza header */
    .call-container {
        max-width: 100%;
        height: 100vh;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        background: #1a1a2e;
    }
    
    /* Video Grid */
    .video-grid {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 10px;
        position: relative;
    }
    
    .video-grid.has-remote {
        grid-template-columns: 1fr 1fr;
    }
    
    /* Layout picture-in-picture quando c'è screen sharing */
    .video-grid.screen-sharing {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
    }
    
    /* Layout normale: io condivido, vedo il mio schermo grande */
    .video-grid.screen-sharing:not(.remote-sharing) #localPlayer {
        grid-column: 1;
        grid-row: 1;
        width: 100%;
        height: 100%;
        position: relative;
        border-radius: 12px;
    }
    
    .video-grid.screen-sharing:not(.remote-sharing) #localPlayer video {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important;
    }
    
    .video-grid.screen-sharing:not(.remote-sharing) #remotePlayer {
        position: fixed;
        bottom: 110px;
        right: 20px;
        width: 250px;
        height: 180px;
        z-index: 50;
        border: 3px solid #667eea;
        border-radius: 12px;
        grid-column: auto;
        grid-row: auto;
    }
    
    .video-grid.screen-sharing:not(.remote-sharing) #remotePlayer video {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
    }
    
    /* Layout invertito: l'altro condivide, vedo il suo schermo grande */
    .video-grid.screen-sharing.remote-sharing #remotePlayer {
        grid-column: 1;
        grid-row: 1;
        width: 100%;
        height: 100%;
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .video-grid.screen-sharing.remote-sharing #remotePlayer video {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important;
    }
    
    .video-grid.screen-sharing.remote-sharing #localPlayer {
        position: fixed;
        bottom: 110px;
        right: 20px;
        width: 250px;
        height: 180px;
        z-index: 50;
        border: 3px solid #667eea;
        border-radius: 12px;
        grid-column: auto;
        grid-row: auto;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .video-grid.screen-sharing.remote-sharing #localPlayer video {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
    }
    
    
    /* Video Players */
    .video-player {
        position: relative;
        background: #16213e;
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .video-player video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    
    .video-label {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 5px 12px;
        border-radius: 6px;
        font-size: 0.9rem;
        font-weight: 600;
    }
    
    .video-placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #8b92a8;
    }
    
    .video-placeholder i {
        font-size: 4rem;
        margin-bottom: 1rem;
        opacity: 0.5;
    }
    
    /* Controls Bar */
    .controls-bar {
        background: #0f1419;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
    }
    
    .control-btn {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        transition: all 0.3s;
        color: white;
    }
    
    .control-btn.mic {
        background: #4a5568;
    }
    
    .control-btn.mic.active {
        background: #667eea;
    }
    
    .control-btn.camera {
        background: #4a5568;
    }
    
    .control-btn.camera.active {
        background: #667eea;
    }
    
    .control-btn.end-call {
        background: #ef4444;
        width: 64px;
        height: 64px;
    }
    
    .control-btn.screen-share {
        background: #4a5568;
    }
    
    .control-btn.screen-share.active {
        background: #8e44ad;
    }
    
    .control-btn:hover {
        transform: scale(1.1);
    }
    
    .control-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    
    /* Timer in controls bar */
    .call-timer-inline {
        color: white;
        font-size: 1.2rem;
        font-weight: bold;
        font-family: 'Courier New', monospace;
        padding: 10px 20px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 80px;
    }
    
    .call-timer-inline span {
        color: #ffffff;
    }
    
    /* Connection Status */
    .connection-status {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9rem;
        z-index: 100;
    }
    
    .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #10b981;
        animation: pulse 2s infinite;
    }
    
    .status-dot.connecting {
        background: #fbbf24;
    }
    
    .status-dot.disconnected {
        background: #ef4444;
    }
    
    /* Call Timer */
    .call-timer {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: 600;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        min-width: 200px;
        text-align: center;
    }
    
    .call-timer.warning {
        background: rgba(239, 68, 68, 0.9);
        animation: timerPulse 1s ease-in-out infinite;
    }
    
    .call-timer-label {
        font-size: 0.75rem;
        opacity: 0.8;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    .call-timer-time {
        font-size: 1.5rem;
        font-family: 'Courier New', monospace;
        font-weight: bold;
    }
    
    @keyframes timerPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
    }
    
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
    
    /* Loading Overlay */
    .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        z-index: 1000;
    }
    
    .loading-overlay .spinner {
        font-size: 3rem;
        animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
</style>

<div class="call-container">
    <!-- Call Timer -->
    <div class="call-timer" id="callTimer">
        <div class="call-timer-label">Tempo rimanente</div>
        <div class="call-timer-time" id="timerDisplay">--:--</div>
    </div>
    
    <!-- Connection Status -->
    <div class="connection-status" id="connectionStatus">
        <div class="status-dot connecting" id="statusDot"></div>
        <span id="statusText">Connessione in corso...</span>
    </div>
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <i class="fas fa-spinner spinner"></i>
        <p style="margin-top: 1rem; font-size: 1.2rem;">Inizializzazione chiamata...</p>
    </div>
    
    <!-- Video Grid -->
    <div class="video-grid" id="videoGrid">
        <!-- Local Video -->
        <div class="video-player" id="localPlayer">
            <div class="video-label">Tu</div>
            <div class="video-placeholder">
                <i class="fas fa-user"></i>
                <p>Video locale</p>
            </div>
        </div>
        
        <!-- Remote Video (appears when other user joins) -->
        <div class="video-player" id="remotePlayer" style="display: none;">
            <div class="video-label" id="remoteLabel">In attesa...</div>
            <div class="video-placeholder">
                <i class="fas fa-user-friends"></i>
                <p>In attesa del partecipante...</p>
            </div>
        </div>
    </div>
    
    <!-- Controls Bar -->
    <div class="controls-bar">
        <button class="control-btn mic active" id="micBtn" title="Microfono">
            <i class="fas fa-microphone"></i>
        </button>
        
        <button class="control-btn camera active" id="cameraBtn" title="Videocamera">
            <i class="fas fa-video"></i>
        </button>
        
        <button class="control-btn screen-share" id="screenShareBtn" title="Condividi schermo">
            <i class="fas fa-desktop"></i>
        </button>
        
        <!-- Timer moved to controls bar -->
        <div class="call-timer-inline" id="callTimerInline">
            <span id="timerDisplayInline">--:--</span>
        </div>
        
        <button class="control-btn end-call" id="endCallBtn" title="Termina chiamata">
            <i class="fas fa-phone-slash"></i>
        </button>
    </div>
</div>

<!-- Agora RTC SDK -->
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>

<script>
    const bookingId = {{ booking.id }};
    const bookingDuration = {{ booking.duration_minutes }};
    const bookingDate = "{{ booking.booking_date.strftime('%Y-%m-%d') }}";
    const bookingEndTimeStr = "{{ booking.end_time }}"; // HH:MM format
    const bookingEndTime = `${bookingDate}T${bookingEndTimeStr}:00`; // Combina data + ora in ISO format
    
    let client = null;
    let localTracks = {
        video: null,
        audio: null
    };
    let screenTrack = null;
    let isScreenSharing = false;
    let remoteUsers = {};
    let callStartTime = null;
    let timerInterval = null;
    let screenShareActive = false; // Traccia se c'è condivisione schermo attiva
    let remoteScreenShareActive = false; // Traccia se l'ALTRO utente sta condividendo lo schermo
    
    // UI Elements
    const loadingOverlay = document.getElementById('loadingOverlay');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const videoGrid = document.getElementById('videoGrid');
    const localPlayer = document.getElementById('localPlayer');
    const remotePlayer = document.getElementById('remotePlayer');
    const remoteLabel = document.getElementById('remoteLabel');
    const micBtn = document.getElementById('micBtn');
    const cameraBtn = document.getElementById('cameraBtn');
    const screenShareBtn = document.getElementById('screenShareBtn');
    const endCallBtn = document.getElementById('endCallBtn');
    const callTimer = document.getElementById('callTimer');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerDisplayInline = document.getElementById('timerDisplayInline');
    
    // Start/Stop Recording functions
    async function startRecording() {
        try {
            const response = await fetch(`/api/booking/${bookingId}/recording/start`, {
                method: 'POST'
            });
            
            if (response.ok) {
                const data = await response.json();
                console.log('📹 Recording avviato:', data.recording_sid);
                return true;
            } else {
                const error = await response.json();
                // Se il recording è già attivo, non è un errore (l'altro utente l'ha già avviato)
                if (error.detail === "Recording già avviato") {
                    console.log('ℹ️ Recording già attivo (avviato dall\'altro utente)');
                    return true;
                }
                console.error('❌ Errore avvio recording:', error.detail);
                return false;
            }
        } catch (error) {
            console.error('❌ Errore start recording:', error);
            return false;
        }
    }
    
    async function stopRecording() {
        try {
            const response = await fetch(`/api/booking/${bookingId}/recording/stop`, {
                method: 'POST'
            });
            
            if (response.ok) {
                const data = await response.json();
                console.log('✅ Recording completato:', data.recording_url);
                return true;
            } else {
                const error = await response.json();
                // Se il recording non era attivo, l'altro utente l'ha già fermato
                if (error.detail === "Nessun recording attivo") {
                    console.log('ℹ️ Recording già fermato (dall\'altro utente)');
                    return true;
                }
                console.error('❌ Errore stop recording:', error.detail);
                return false;
            }
        } catch (error) {
            console.error('❌ Errore stop recording:', error);
            return false;
        }
    }
    
    // Start call timer - basato su end_time del booking + 5 minuti
    function startCallTimer() {
        // Calcola l'orario di scadenza: end_time del booking + 5 minuti
        const endDateTime = new Date(bookingEndTime);
        const callDeadline = new Date(endDateTime.getTime() + 5 * 60 * 1000); // Aggiungi 5 minuti
        
        console.log(`📅 Booking end time: ${bookingEndTime}`);
        console.log(`⏰ Call deadline (end_time + 5min): ${callDeadline.toISOString()}`);
        
        timerInterval = setInterval(() => {
            const now = new Date();
            const remainingMilliseconds = callDeadline - now;
            const remainingSeconds = Math.floor(remainingMilliseconds / 1000);
            
            if (remainingSeconds <= 0) {
                // Tempo scaduto - termina call automaticamente
                clearInterval(timerInterval);
                console.log('⏰ Timer scaduto - notificando il server...');
                
                // ✅ Notifica al backend che la call è terminata
                fetch(`/api/booking/${bookingId}/call-end`, { method: 'POST' })
                    .catch(err => console.error('Errore notifica end call:', err));
                
                alert('Il tempo della consulenza è terminato. La chiamata verrà chiusa.');
                leaveCall().then(() => {
                    window.location.href = '/profile';
                });
                return;
            }
            
            // Calcola minuti e secondi rimanenti
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            
            // Aggiorna display
            timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            timerDisplayInline.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            // Avviso quando mancano 5 minuti
            if (remainingSeconds === 300) {
                alert('⏰ Attenzione: mancano 5 minuti alla fine della consulenza');
            }
            
            // Avviso quando manca 1 minuto
            if (remainingSeconds === 60) {
                alert('⏰ Attenzione: manca 1 minuto alla fine della consulenza');
            }
            
            // Cambia colore quando mancano 3 minuti (rosso lampeggiante)
            if (remainingSeconds <= 180) {
                callTimer.classList.add('warning');
            } else {
                callTimer.classList.remove('warning');
            }
        }, 1000); // Aggiorna ogni secondo
    }
    
    // Initialize Agora
    async function initializeCall() {
        try {
            // ✅ PRIMO: Verifica che la call sia ancora attiva
            console.log('📞 Verificando se la call è ancora attiva...');
            const statusResponse = await fetch(`/api/booking/${bookingId}/call-status`);
            
            if (!statusResponse.ok) {
                throw new Error('Errore nella verifica dello stato della call');
            }
            
            const statusData = await statusResponse.json();
            console.log('📞 Call status:', statusData);
            
            if (statusData.is_expired) {
                console.log('❌ La call è scaduta! Reindirizzamento a profile...');
                alert('Scusa, il tempo della consulenza è scaduto. Non puoi riaccedere a questa call.');
                window.location.href = '/profile';
                return;
            }
            
            console.log(`✅ Call attiva - tempo rimasto: ${statusData.remaining_seconds} secondi`);
            
            // Get Agora token from backend
            const response = await fetch(`/api/booking/${bookingId}/agora-token`);
            if (!response.ok) {
                throw new Error('Failed to get Agora token');
            }
            
            const data = await response.json();
            console.log('Agora credentials:', data);
            
            // Create Agora client
            client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
            
            // Event listeners
            client.on("user-published", handleUserPublished);
            client.on("user-unpublished", handleUserUnpublished);
            client.on("user-left", handleUserLeft);
            
            // Join channel
            await client.join(data.app_id, data.channel_name, data.token, data.uid);
            updateStatus('connected', 'Connesso');
            
            // Create local tracks
            localTracks.audio = await AgoraRTC.createMicrophoneAudioTrack();
            localTracks.video = await AgoraRTC.createCameraVideoTrack();
            
            // Play local video
            localTracks.video.play('localPlayer');
            
            // Hide local placeholder
            const localPlaceholder = localPlayer.querySelector('.video-placeholder');
            if (localPlaceholder) {
                localPlaceholder.style.display = 'none';
            }
            
            // Publish local tracks
            await client.publish([localTracks.audio, localTracks.video]);
            
            // Start call timer
            startCallTimer();
            
            // ✅ Avvia polling per sincronizzare screen share con l'altro utente
            startScreenSharePolling();
            
            // Avvia registrazione automaticamente
            await startRecording();
            
            loadingOverlay.style.display = 'none';
            
        } catch (error) {
            console.error('Error initializing call:', error);
            alert('Errore durante l\'inizializzazione della chiamata: ' + error.message);
            updateStatus('disconnected', 'Errore di connessione');
        }
    }
    
    // Handle remote user published
    async function handleUserPublished(user, mediaType) {
        remoteUsers[user.uid] = user;
        await client.subscribe(user, mediaType);
        
        if (mediaType === 'video') {
            remotePlayer.style.display = 'block';
            videoGrid.classList.add('has-remote');
            user.videoTrack.play('remotePlayer');
            remoteLabel.textContent = 'Partecipante';
            
            // Hide remote placeholder
            const remotePlaceholder = remotePlayer.querySelector('.video-placeholder');
            if (remotePlaceholder) {
                remotePlaceholder.style.display = 'none';
            }
        }
        
        if (mediaType === 'audio') {
            user.audioTrack.play();
        }
    }
    
    // Handle remote user unpublished
    function handleUserUnpublished(user, mediaType) {
        if (mediaType === 'video' && user.videoTrack) {
            user.videoTrack.stop();
        }
    }
    
    // Handle remote user left
    function handleUserLeft(user) {
        delete remoteUsers[user.uid];
        remotePlayer.style.display = 'none';
        videoGrid.classList.remove('has-remote');
    }
    
    // Toggle microphone
    micBtn.addEventListener('click', () => {
        const isEnabled = localTracks.audio.enabled;
        localTracks.audio.setEnabled(!isEnabled);
        micBtn.classList.toggle('active');
        micBtn.querySelector('i').className = isEnabled ? 'fas fa-microphone-slash' : 'fas fa-microphone';
    });
    
    // Toggle camera
    cameraBtn.addEventListener('click', () => {
        const isEnabled = localTracks.video.enabled;
        localTracks.video.setEnabled(!isEnabled);
        cameraBtn.classList.toggle('active');
        cameraBtn.querySelector('i').className = isEnabled ? 'fas fa-video-slash' : 'fas fa-video';
    });
    
    // Toggle screen share
    screenShareBtn.addEventListener('click', async () => {
        if (isScreenSharing) {
            // Stop screen sharing, tornare alla webcam
            await stopScreenShare();
        } else {
            // Start screen sharing
            await startScreenShare();
        }
    });
    
    async function startScreenShare() {
        try {
            // Crea screen track
            screenTrack = await AgoraRTC.createScreenVideoTrack({
                encoderConfig: "1080p_1",
                optimizationMode: "detail"
            });
            
            // Unpublish e ferma il video corrente
            if (localTracks.video) {
                await client.unpublish(localTracks.video);
                localTracks.video.stop();
                localTracks.video.close();
            }
            
            // Pubblica screen track
            await client.publish(screenTrack);
            
            // Mostra schermo nel video locale
            screenTrack.play('localPlayer');
            
            isScreenSharing = true;
            screenShareActive = true;
            
            // Aggiorna il layout per picture-in-picture
            videoGrid.classList.add('screen-sharing');
            
            // Notifica al backend che stai condividendo lo schermo
            try {
                await fetch(`/api/booking/${bookingId}/screen-share/start`, {
                    method: 'POST'
                });
                console.log('✅ Screen share notification sent to server');
            } catch (error) {
                console.error('⚠️ Errore notifica screen share:', error);
            }
            
            screenShareBtn.classList.add('active');
            screenShareBtn.querySelector('i').className = 'fas fa-desktop';
            
            // Quando l'utente ferma la condivisione dal browser
            screenTrack.on("track-ended", async () => {
                await stopScreenShare();
            });
            
        } catch (error) {
            console.error('Errore avvio screen share:', error);
            alert('Impossibile condividere lo schermo. Assicurati di dare i permessi necessari.');
        }
    }
    
    async function stopScreenShare() {
        try {
            if (screenTrack) {
                // Unpublish e ferma screen track
                await client.unpublish(screenTrack);
                screenTrack.stop();
                screenTrack.close();
                screenTrack = null;
            }
            
            // Ricrea e pubblica il video della webcam
            localTracks.video = await AgoraRTC.createCameraVideoTrack();
            await client.publish(localTracks.video);
            localTracks.video.play('localPlayer');
            
            isScreenSharing = false;
            screenShareActive = false;
            
            // Ripristina il layout normale
            videoGrid.classList.remove('screen-sharing');
            
            // Notifica al backend che hai smesso di condividere lo schermo
            try {
                await fetch(`/api/booking/${bookingId}/screen-share/stop`, {
                    method: 'POST'
                });
                console.log('✅ Screen share stop notification sent to server');
            } catch (error) {
                console.error('⚠️ Errore notifica stop screen share:', error);
            }
            
            screenShareBtn.classList.remove('active');
            screenShareBtn.querySelector('i').className = 'fas fa-desktop';
            
        } catch (error) {
            console.error('Errore stop screen share:', error);
        }
    }
    
    // End call
    endCallBtn.addEventListener('click', async () => {
        if (confirm('Sei sicuro di voler terminare la chiamata?')) {
            await leaveCall();
            window.location.href = '/profile';
        }
    });
    
    // Leave call
    async function leaveCall() {
        // Stop screen share polling
        stopScreenSharePolling();
        
        // Stop recording
        await stopRecording();
        
        // Stop timer
        if (timerInterval) {
            clearInterval(timerInterval);
        }
        
        // Stop screen share if active
        if (screenTrack) {
            screenTrack.stop();
            screenTrack.close();
            screenTrack = null;
        }
        
        for (let trackName in localTracks) {
            const track = localTracks[trackName];
            if (track) {
                track.stop();
                track.close();
            }
        }
        
        if (client) {
            await client.leave();
        }
    }
    
    // Update connection status
    function updateStatus(status, text) {
        statusDot.className = `status-dot ${status}`;
        statusText.textContent = text;
    }
    
    // Initialize on page load
    initializeCall();
    
    // Cleanup on page unload (chiusura browser, tab, refresh)
    window.addEventListener('beforeunload', (e) => {
        // Mostra popup di conferma
        e.preventDefault();
        e.returnValue = 'Sei sicuro di voler chiudere la chiamata? La registrazione sarà interrotta.';
        
        // Stop recording usando sendBeacon (funziona anche se la pagina si chiude)
        // sendBeacon è garantito essere eseguito anche durante la chiusura
        const stopUrl = `/api/booking/${bookingId}/recording/stop`;
        const blob = new Blob(['{}'], { type: 'application/json' });
        navigator.sendBeacon(stopUrl, blob);
        
        // Cleanup Agora resources (sincrono)
        if (timerInterval) {
            clearInterval(timerInterval);
        }
        
        // Stop screen share if active
        if (screenTrack) {
            try {
                screenTrack.stop();
                screenTrack.close();
            } catch (err) {
                console.error('Error stopping screen track:', err);
            }
        }
        
        for (let trackName in localTracks) {
            const track = localTracks[trackName];
            if (track) {
                try {
                    track.stop();
                    track.close();
                } catch (err) {
                    console.error('Error stopping track:', err);
                }
            }
        }
        
        if (client) {
            try {
                client.leave();
            } catch (err) {
                console.error('Error leaving channel:', err);
            }
        }
    });
    
    // Cleanup anche su visibilitychange (quando cambi tab)
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
            // Utente ha cambiato tab, potrebbe non tornare
            const stopUrl = `/api/booking/${bookingId}/recording/stop`;
            const blob = new Blob(['{}'], { type: 'application/json' });
            navigator.sendBeacon(stopUrl, blob);
        }
    });
    
    // ========== POLLING PER SINCRONIZZARE SCREEN SHARE STATE ==========
    
    let screenShareCheckInterval = null;
    
    /**
     * Controlla se l'altro utente sta condividendo lo schermo
     */
    async function checkRemoteScreenShareState() {
        try {
            const response = await fetch(`/api/booking/${bookingId}/screen-share/status`);
            if (!response.ok) return;
            
            const data = await response.json();
            
            // Se IO sto condividendo, non mi interessa cosa fa l'altro
            if (isScreenSharing) {
                return;
            }
            
            // Se l'altro utente sta condividendo e noi non abbiamo ancora aggiunto la classe
            if (data.is_remote_sharing && !remoteScreenShareActive) {
                console.log('📺 L\'altro utente sta condividendo lo schermo, aggiorno layout (inverted)');
                remoteScreenShareActive = true;
                videoGrid.classList.add('screen-sharing');
                videoGrid.classList.add('remote-sharing'); // ✅ Aggiungi classe per layout invertito
            }
            // Se l'altro utente ha smesso di condividere e noi avevamo aggiunto la classe
            else if (!data.is_remote_sharing && remoteScreenShareActive) {
                console.log('🎥 L\'altro utente ha smesso di condividere, ripristino layout');
                remoteScreenShareActive = false;
                videoGrid.classList.remove('screen-sharing');
                videoGrid.classList.remove('remote-sharing'); // ✅ Rimuovi classe layout invertito
            }
        } catch (error) {
            console.error('Errore check screen share state:', error);
        }
    }
    
    /**
     * Avvia polling dello screen share state
     */
    function startScreenSharePolling() {
        // Ferma polling precedente se esiste
        if (screenShareCheckInterval) {
            clearInterval(screenShareCheckInterval);
        }
        // Controlla ogni 500ms (mezzo secondo) per sincronizzazione veloce
        screenShareCheckInterval = setInterval(checkRemoteScreenShareState, 500);
        console.log('✅ Polling screen share state avviato');
    }
    
    /**
     * Ferma polling dello screen share state
     */
    function stopScreenSharePolling() {
        if (screenShareCheckInterval) {
            clearInterval(screenShareCheckInterval);
            screenShareCheckInterval = null;
        }
    }
</script>
{% endblock %}
