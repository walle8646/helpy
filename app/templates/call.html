{% extends "base.html" %}

{% block title %}Consulenza in Corso - Helpy{% endblock %}

{% block content %}
<style>
    /* Nascondi l'header */
    .navbar {
        display: none !important;
    }
    
    /* Adatta il container per fullscreen senza header */
    .call-container {
        max-width: 100%;
        height: 100vh;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        background: #1a1a2e;
    }
    
    /* Video Grid */
    .video-grid {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 10px;
        position: relative;
    }
    
    .video-grid.has-remote {
        grid-template-columns: 1fr 1fr;
    }
    
    /* Layout picture-in-picture quando c'è screen sharing */
    .video-grid.screen-sharing {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
    }
    
    /* Layout normale: io condivido, vedo il mio schermo grande */
    .video-grid.screen-sharing:not(.remote-sharing) #localPlayer {
        grid-column: 1;
        grid-row: 1;
        width: 100%;
        height: 100%;
        position: relative;
        border-radius: 12px;
    }
    
    .video-grid.screen-sharing:not(.remote-sharing) #localPlayer video {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important;
    }
    
    .video-grid.screen-sharing:not(.remote-sharing) #remotePlayer {
        position: fixed;
        bottom: 110px;
        right: 20px;
        width: 250px;
        height: 180px;
        z-index: 50;
        border: 3px solid #667eea;
        border-radius: 12px;
        grid-column: auto;
        grid-row: auto;
    }
    
    .video-grid.screen-sharing:not(.remote-sharing) #remotePlayer video {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
    }
    
    /* Layout invertito: l'altro condivide, vedo il suo schermo grande */
    .video-grid.screen-sharing.remote-sharing #remotePlayer {
        grid-column: 1;
        grid-row: 1;
        width: 100%;
        height: 100%;
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .video-grid.screen-sharing.remote-sharing #remotePlayer video {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important;
    }
    
    .video-grid.screen-sharing.remote-sharing #localPlayer {
        position: fixed;
        bottom: 110px;
        right: 20px;
        width: 250px;
        height: 180px;
        z-index: 50;
        border: 3px solid #667eea;
        border-radius: 12px;
        grid-column: auto;
        grid-row: auto;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .video-grid.screen-sharing.remote-sharing #localPlayer video {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
    }
    
    
    /* Video Players */
    .video-player {
        position: relative;
        background: #16213e;
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .video-player video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    
    .video-label {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 5px 12px;
        border-radius: 6px;
        font-size: 0.9rem;
        font-weight: 600;
    }
    
    .video-placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #8b92a8;
    }
    
    .video-placeholder i {
        font-size: 4rem;
        margin-bottom: 1rem;
        opacity: 0.5;
    }
    
    /* Controls Bar */
    .controls-bar {
        background: #0f1419;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
    }
    
    .control-btn {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        transition: all 0.3s;
        color: white;
    }
    
    .control-btn.mic {
        background: #4a5568;
    }
    
    .control-btn.mic.active {
        background: #667eea;
    }
    
    .control-btn.camera {
        background: #4a5568;
    }
    
    .control-btn.camera.active {
        background: #667eea;
    }
    
    .control-btn.end-call {
        background: #ef4444;
        width: 64px;
        height: 64px;
    }
    
    .control-btn.screen-share {
        background: #4a5568;
    }
    
    .control-btn.screen-share.active {
        background: #8e44ad;
    }
    
    .control-btn:hover {
        transform: scale(1.1);
    }
    
    .control-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    
    /* Timer in controls bar */
    .call-timer-inline {
        color: white;
        font-size: 1.2rem;
        font-weight: bold;
        font-family: 'Courier New', monospace;
        padding: 10px 20px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 80px;
    }
    
    .call-timer-inline span {
        color: #ffffff;
    }
    
    /* Connection Status */
    .connection-status {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9rem;
        z-index: 100;
    }
    
    .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #10b981;
        animation: pulse 2s infinite;
    }
    
    .status-dot.connecting {
        background: #fbbf24;
    }
    
    .status-dot.disconnected {
        background: #ef4444;
    }
    
    /* Call Timer */
    .call-timer {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: 600;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        min-width: 200px;
        text-align: center;
    }
    
    .call-timer.warning {
        background: rgba(239, 68, 68, 0.9);
        animation: timerPulse 1s ease-in-out infinite;
    }
    
    .call-timer-label {
        font-size: 0.75rem;
        opacity: 0.8;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    .call-timer-time {
        font-size: 1.5rem;
        font-family: 'Courier New', monospace;
        font-weight: bold;
    }
    
    /* ========== CHAT PANEL STYLES ========== */
    
    .chat-panel {
        position: fixed;
        right: 20px;
        bottom: 110px;
        width: 300px;
        height: 400px;
        background: rgba(20, 20, 40, 0.95);
        border: 2px solid #667eea;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        z-index: 40;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(102, 126, 234, 0.2);
    }
    
    .chat-header {
        padding: 12px 16px;
        border-bottom: 1px solid #667eea;
        font-weight: 600;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(102, 126, 234, 0.1);
    }
    
    .chat-header-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.95rem;
    }
    
    .chat-header i {
        color: #667eea;
    }
    
    .chat-toggle-btn {
        background: none;
        border: none;
        color: #667eea;
        cursor: pointer;
        font-size: 1.2rem;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .chat-toggle-btn:hover {
        color: #8b9bff;
    }
    
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    
    .chat-message {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }
    
    .chat-message.own {
        align-items: flex-end;
    }
    
    .chat-message-sender {
        font-size: 0.75rem;
        color: #a0aec0;
        padding: 0 8px;
    }
    
    .chat-message-text {
        background: #667eea;
        color: white;
        padding: 8px 12px;
        border-radius: 12px;
        font-size: 0.9rem;
        word-wrap: break-word;
        max-width: 85%;
        line-height: 1.3;
    }
    
    .chat-message.own .chat-message-text {
        background: #667eea;
    }
    
    .chat-message:not(.own) .chat-message-text {
        background: #2d3748;
    }

    /* Chat Attachments in Messages */
    .chat-message-attachments {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 8px;
        max-width: 85%;
    }

    .chat-attachment {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(102, 126, 234, 0.15);
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 0.9rem;
        border: 1px solid rgba(102, 126, 234, 0.3);
    }

    .chat-attachment i {
        color: #667eea;
        font-size: 1rem;
        flex-shrink: 0;
    }

    .chat-attachment a {
        color: #667eea;
        text-decoration: none;
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 0.2s;
    }

    .chat-attachment a:hover {
        color: #8b9bff;
        text-decoration: underline;
    }

    .attachment-size {
        color: #718096;
        font-size: 0.8rem;
        flex-shrink: 0;
    }

    .chat-input-area {
        padding: 10px;
        border-top: 1px solid #667eea;
        display: flex;
        gap: 8px;
        background: rgba(102, 126, 234, 0.05);
    }
    
    .chat-input {
        flex: 1;
        background: #1a1a2e;
        border: 1px solid #667eea;
        border-radius: 8px;
        color: white;
        padding: 8px 12px;
        font-size: 0.9rem;
        outline: none;
        font-family: inherit;
    }
    
    .chat-input::placeholder {
        color: #718096;
    }
    
    .chat-input:focus {
        border-color: #8b9bff;
        box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
    }
    
    .chat-send-btn {
        background: #667eea;
        border: none;
        color: white;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        transition: all 0.2s;
    }
    
    .chat-send-btn:hover {
        background: #8b9bff;
        transform: translateY(-2px);
    }
    
    .chat-send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* Chat Attach Button */
    .chat-attach-btn {
        background: transparent;
        border: none;
        color: #667eea;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .chat-attach-btn:hover {
        background: rgba(102, 126, 234, 0.1);
        color: #8b9bff;
    }

    .chat-attach-btn:active {
        transform: scale(0.95);
    }

    /* Chat Attachments Preview */
    .chat-attachments-preview {
        background: rgba(102, 126, 234, 0.05);
        border-top: 1px solid #667eea;
        padding: 10px 12px;
        max-height: 150px;
        overflow-y: auto;
    }

    .attachments-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
    }

    .attachment-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(102, 126, 234, 0.1);
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 0.85rem;
        color: #cbd5e0;
    }

    .attachment-item-info {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 0;
    }

    .attachment-item-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .attachment-item-size {
        color: #718096;
        font-size: 0.8rem;
    }

    .attachment-item-remove {
        background: none;
        border: none;
        color: #ef4444;
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
    }

    .attachment-item-remove:hover {
        color: #ff5555;
        transform: scale(1.1);
    }

    .attachments-clear {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
    }

    .clear-attachments-btn {
        background: rgba(239, 68, 68, 0.2);
        border: 1px solid #ef4444;
        color: #ef4444;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all 0.2s;
    }

    .clear-attachments-btn:hover {
        background: rgba(239, 68, 68, 0.3);
    }
    
    .chat-toggle {
        position: fixed;
        bottom: 130px;
        right: 20px;
        width: 50px;
        height: 50px;
        background: #667eea;
        border: none;
        border-radius: 50%;
        color: white;
        cursor: pointer;
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 39;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        transition: all 0.3s;
    }
    
    .chat-toggle:hover {
        background: #8b9bff;
        transform: scale(1.1);
    }
    
    .chat-toggle.hidden {
        display: none;
    }
    
    /* Badge notifiche non lette */
    .chat-badge {
        position: absolute;
        top: -8px;
        right: -8px;
        background: #ef4444;
        color: white;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: bold;
        border: 2px solid #1a1a2e;
    }
    
    /* Scrollbar personalizzata */
    .chat-messages::-webkit-scrollbar {
        width: 6px;
    }
    
    .chat-messages::-webkit-scrollbar-track {
        background: rgba(102, 126, 234, 0.1);
        border-radius: 10px;
    }
    
    .chat-messages::-webkit-scrollbar-thumb {
        background: #667eea;
        border-radius: 10px;
    }
    
    .chat-messages::-webkit-scrollbar-thumb:hover {
        background: #8b9bff;
    }
    
    /* Toast Notification */
    .toast-notification {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: #667eea;
        color: white;
        padding: 16px 24px;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 1000;
        animation: slideIn 0.3s ease-out;
        font-size: 0.95rem;
        pointer-events: none; /* Non riceve click */
    }
    
    .toast-notification i {
        font-size: 1.2rem;
    }
    
    @keyframes slideIn {
        from {
            transform: translateX(400px);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }
    
    @keyframes slideOut {
        from {
            transform: translateX(0);
            opacity: 1;
        }
        to {
            transform: translateX(400px);
            opacity: 0;
        }
    }

        @keyframes timerPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
    }
    
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
    
    /* Loading Overlay */
    .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        z-index: 1000;
    }
    
    .loading-overlay .spinner {
        font-size: 3rem;
        animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
</style>

<div class="call-container">
    <!-- Call Timer -->
    <div class="call-timer" id="callTimer">
        <div class="call-timer-label">Tempo rimanente</div>
        <div class="call-timer-time" id="timerDisplay">--:--</div>
    </div>
    
    <!-- Connection Status -->
    <div class="connection-status" id="connectionStatus">
        <div class="status-dot connecting" id="statusDot"></div>
        <span id="statusText">Connessione in corso...</span>
    </div>
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <i class="fas fa-spinner spinner"></i>
        <p style="margin-top: 1rem; font-size: 1.2rem;">Inizializzazione chiamata...</p>
    </div>
    
    <!-- Video Grid -->
    <div class="video-grid" id="videoGrid">
        <!-- Local Video -->
        <div class="video-player" id="localPlayer">
            <div class="video-label">Tu</div>
            <div class="video-placeholder">
                <i class="fas fa-user"></i>
                <p>Video locale</p>
            </div>
        </div>
        
        <!-- Remote Video (appears when other user joins) -->
        <div class="video-player" id="remotePlayer" style="display: none;">
            <div class="video-label" id="remoteLabel">In attesa...</div>
            <div class="video-placeholder">
                <i class="fas fa-user-friends"></i>
                <p>In attesa del partecipante...</p>
            </div>
        </div>
    </div>
    
    <!-- Controls Bar -->
    <div class="controls-bar">
        <button class="control-btn mic active" id="micBtn" title="Microfono">
            <i class="fas fa-microphone"></i>
        </button>
        
        <button class="control-btn camera active" id="cameraBtn" title="Videocamera">
            <i class="fas fa-video"></i>
        </button>
        
        <button class="control-btn screen-share" id="screenShareBtn" title="Condividi schermo">
            <i class="fas fa-desktop"></i>
        </button>
        
        <!-- Timer moved to controls bar -->
        <div class="call-timer-inline" id="callTimerInline">
            <span id="timerDisplayInline">--:--</span>
        </div>
        
        <button class="control-btn end-call" id="endCallBtn" title="Termina chiamata">
            <i class="fas fa-phone-slash"></i>
        </button>
    </div>
</div>

<!-- Chat Panel -->
<button class="chat-toggle" id="chatToggleBtn" title="Chat">
    <i class="fas fa-comments"></i>
    <div class="chat-badge" id="chatBadge" style="display: none;">0</div>
</button>

<div class="chat-panel" id="chatPanel" style="display: none;">
    <div class="chat-header">
        <div class="chat-header-title">
            <i class="fas fa-comments"></i>
            <span>Chat</span>
        </div>
        <button class="chat-toggle-btn" id="chatCloseBtn" title="Chiudi chat">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div style="color: #718096; font-size: 0.85rem; text-align: center; margin: auto; padding: 10px;">
            Nessun messaggio ancora
        </div>
    </div>
    
    <div class="chat-input-area">
        <input 
            type="text" 
            class="chat-input" 
            id="chatInput" 
            placeholder="Scrivi un messaggio..." 
            autocomplete="off"
        />
        
        <!-- Input nascosto per file -->
        <input 
            type="file" 
            id="chatFileInput" 
            style="display: none;" 
            accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip"
            multiple
        />
        
        <!-- Pulsante Allegati -->
        <button class="chat-attach-btn" id="chatAttachBtn" title="Allega file">
            <i class="fas fa-paperclip"></i>
        </button>
        
        <!-- Pulsante Invia -->
        <button class="chat-send-btn" id="chatSendBtn" title="Invia">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
    
    <!-- Anteprima file allegati -->
    <div class="chat-attachments-preview" id="chatAttachmentsPreview" style="display: none;">
        <div class="attachments-list" id="attachmentsList"></div>
        <div class="attachments-clear">
            <button class="clear-attachments-btn" id="clearAttachmentsBtn">Cancella tutti</button>
        </div>
    </div>
</div>

<!-- Agora RTC SDK -->
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>

<script>
    const bookingId = {{ booking.id }};
    const bookingDuration = {{ booking.duration_minutes }};
    const bookingDate = "{{ booking.booking_date.strftime('%Y-%m-%d') }}";
    const bookingEndTimeStr = "{{ booking.end_time }}"; // HH:MM format
    const bookingEndTime = `${bookingDate}T${bookingEndTimeStr}:00`; // Combina data + ora in ISO format
    
    let client = null;
    let localTracks = {
        video: null,
        audio: null
    };
    let screenTrack = null;
    let isScreenSharing = false;
    let remoteUsers = {};
    let callStartTime = null;
    let timerInterval = null;
    let screenShareActive = false; // Traccia se c'è condivisione schermo attiva
    let remoteScreenShareActive = false; // Traccia se l'ALTRO utente sta condividendo lo schermo
    let screenShareCheckInterval = null; // Interval per il polling dello screen share
    let chatPollInterval = null; // Interval per il polling dei messaggi chat
    let displayedMessageIds = new Set(); // Traccia dei messaggi già visualizzati
    
    // UI Elements
    const loadingOverlay = document.getElementById('loadingOverlay');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    // Gestione allegati
    function updateAttachmentsPreview() {
        if (chatUI.attachments.length === 0) {
            chatUI.attachmentsPreview.style.display = 'none';
            chatUI.attachmentsList.innerHTML = '';
            return;
        }
        
        chatUI.attachmentsPreview.style.display = 'block';
        chatUI.attachmentsList.innerHTML = chatUI.attachments.map((file, idx) => `
            <div class="attachment-item">
                <div class="attachment-item-info">
                    <i class="fas fa-file"></i>
                    <span class="attachment-item-name" title="${file.name}">${file.name}</span>
                    <span class="attachment-item-size">${(file.size / 1024).toFixed(1)}KB</span>
                </div>
                <button class="attachment-item-remove" onclick="removeAttachment(${idx})" title="Rimuovi">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        `).join('');
    }
    
    function removeAttachment(index) {
        chatUI.attachments.splice(index, 1);
        updateAttachmentsPreview();
    }
    
    function clearAllAttachments() {
        chatUI.attachments = [];
        chatUI.fileInput.value = '';
        updateAttachmentsPreview();
    }
    
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    });
    
    chatUI.fileInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        const maxFileSize = 50 * 1024 * 1024; // 50MB
        
        files.forEach(file => {
            if (file.size > maxFileSize) {
                alert(`File ${file.name} è troppo grande (max 50MB)`);
                return;
            }
            
            // Evita duplicati
            if (!chatUI.attachments.some(f => f.name === file.name && f.size === file.size)) {
                chatUI.attachments.push(file);
            }
        });
        
        updateAttachmentsPreview();
        chatUI.fileInput.value = ''; // Reset per permettere lo stesso file una volta rimosso
    });

    // Start/Stop Recording functions
    async function startRecording() {
        try {
            const response = await fetch(`/api/booking/${bookingId}/recording/start`, {
                method: 'POST'
            });
            
            if (response.ok) {
                const data = await response.json();
                console.log('📹 Recording avviato:', data.recording_sid);
                return true;
            } else {
                const error = await response.json();
                // Se il recording è già attivo, non è un errore (l'altro utente l'ha già avviato)
                if (error.detail === "Recording già avviato") {
                    console.log('ℹ️ Recording già attivo (avviato dall\'altro utente)');
                    return true;
                }
                console.error('❌ Errore avvio recording:', error.detail);
                return false;
            }
        } catch (error) {
            console.error('❌ Errore start recording:', error);
            return false;
        }
    }
    
    async function stopRecording() {
        console.log('📹 [STOP_REC] stopRecording() called');
        try {
            const response = await fetch(`/api/booking/${bookingId}/recording/stop`, {
                method: 'POST'
            });
            console.log('📹 [STOP_REC] Response status:', response.status);
            
            if (response.ok) {
                const data = await response.json();
                console.log('✅ [STOP_REC] Recording completato:', data.recording_url);
                return true;
            } else {
                const error = await response.json();
                console.log('📹 [STOP_REC] Error response:', error);
                // Se il recording non era attivo, l'altro utente l'ha già fermato
                if (error.detail === "Nessun recording attivo") {
                    console.log('ℹ️ [STOP_REC] Recording già fermato (dall\'altro utente)');
                    return true;
                }
                console.error('❌ [STOP_REC] Errore stop recording:', error.detail);
                return false;
            }
        } catch (error) {
            console.error('❌ [STOP_REC] Errore fetch:', error);
            return false;
        }
    }
    
    // Start call timer - basato su end_time del booking + 5 minuti
    function startCallTimer() {
        // Calcola l'orario di scadenza: end_time del booking + 5 minuti
        const endDateTime = new Date(bookingEndTime);
        const callDeadline = new Date(endDateTime.getTime() + 5 * 60 * 1000); // Aggiungi 5 minuti
        
        console.log(`📅 Booking end time: ${bookingEndTime}`);
        console.log(`⏰ Call deadline (end_time + 5min): ${callDeadline.toISOString()}`);
        
        timerInterval = setInterval(() => {
            const now = new Date();
            const remainingMilliseconds = callDeadline - now;
            const remainingSeconds = Math.floor(remainingMilliseconds / 1000);
            
            if (remainingSeconds <= 0) {
                // Tempo scaduto - termina call automaticamente
                clearInterval(timerInterval);
                console.log('⏰ Timer scaduto - notificando il server...');
                
                // ✅ Notifica al backend che la call è terminata
                fetch(`/api/booking/${bookingId}/call-end`, { method: 'POST' })
                    .catch(err => console.error('Errore notifica end call:', err));
                
                alert('Il tempo della consulenza è terminato. La chiamata verrà chiusa.');
                leaveCall().then(() => {
                    window.location.href = '/profile';
                });
                return;
            }
            
            // Calcola minuti e secondi rimanenti
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            
            // Aggiorna display
            timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            timerDisplayInline.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            // Avviso quando mancano 5 minuti
            if (remainingSeconds === 300) {
                alert('⏰ Attenzione: mancano 5 minuti alla fine della consulenza');
            }
            
            // Avviso quando manca 1 minuto
            if (remainingSeconds === 60) {
                alert('⏰ Attenzione: manca 1 minuto alla fine della consulenza');
            }
            
            // Cambia colore quando mancano 3 minuti (rosso lampeggiante)
            if (remainingSeconds <= 180) {
                callTimer.classList.add('warning');
            } else {
                callTimer.classList.remove('warning');
            }
        }, 1000); // Aggiorna ogni secondo
    }
    
    // Initialize Agora
    async function initializeCall() {
        try {
            // ✅ PRIMO: Verifica che la call sia ancora attiva
            console.log('📞 Verificando se la call è ancora attiva...');
            const statusResponse = await fetch(`/api/booking/${bookingId}/call-status`);
            
            if (!statusResponse.ok) {
                throw new Error('Errore nella verifica dello stato della call');
            }
            
            const statusData = await statusResponse.json();
            console.log('📞 Call status:', statusData);
            
            if (statusData.is_expired) {
                console.log('❌ La call è scaduta! Reindirizzamento a profile...');
                alert('Scusa, il tempo della consulenza è scaduto. Non puoi riaccedere a questa call.');
                window.location.href = '/profile';
                return;
            }
            
            console.log(`✅ Call attiva - tempo rimasto: ${statusData.remaining_seconds} secondi`);
            
            // 🔔 Prima di unirti ad Agora, segna che hai joinato la booking
            console.log(`🔔 Marking user as joined for booking ${bookingId}...`);
            try {
                const joinResponse = await fetch(`/api/booking/${bookingId}/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (joinResponse.ok) {
                    const joinData = await joinResponse.json();
                    console.log(`✅ User joined booking - recording_status: ${joinData.recording_status}`);
                } else {
                    console.warn(`⚠️ Failed to mark user as joined: ${joinResponse.status}`);
                }
            } catch (e) {
                console.error('❌ Error marking user as joined:', e);
            }
            
            // Get Agora token from backend
            const response = await fetch(`/api/booking/${bookingId}/agora-token`);
            if (!response.ok) {
                throw new Error('Failed to get Agora token');
            }
            
            const data = await response.json();
            console.log('Agora credentials:', data);
            
            // Create Agora client
            client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
            
            // Event listeners
            client.on("user-published", handleUserPublished);
            client.on("user-unpublished", handleUserUnpublished);
            client.on("user-left", handleUserLeft);
            
            // Join channel
            await client.join(data.app_id, data.channel_name, data.token, data.uid);
            updateStatus('connected', 'Connesso');
            
            // 📞 Marca che la call è stata avviata
            try {
                await fetch(`/api/booking/${bookingId}/call-start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                console.log('📞 Marcata call come avviata per il booking', bookingId);
            } catch (e) {
                console.error('Errore nel marcare call come avviata:', e);
            }
            
            // Create local tracks
            localTracks.audio = await AgoraRTC.createMicrophoneAudioTrack();
            localTracks.video = await AgoraRTC.createCameraVideoTrack();
            
            // Play local video
            localTracks.video.play('localPlayer');
            
            // Hide local placeholder
            const localPlaceholder = localPlayer.querySelector('.video-placeholder');
            if (localPlaceholder) {
                localPlaceholder.style.display = 'none';
            }
            
            // Publish local tracks
            await client.publish([localTracks.audio, localTracks.video]);
            console.log('✅ Published local tracks');
            
            // 🎬 Notify backend that we're ready to start recording
            console.log('🎬 [init] Ready to start recording - notifying backend...');
            try {
                const recordingStartResponse = await fetch(`/api/booking/${bookingId}/recording/start-now`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const recordingData = await recordingStartResponse.json();
                if (recordingStartResponse.ok) {
                    console.log('✅ [init] Recording started by backend:', recordingData.filename);
                } else {
                    console.warn('⚠️ [init] Recording start failed:', recordingData.message);
                }
            } catch (e) {
                console.error('❌ [init] Error notifying recording start:', e);
            }
            
            // Start call timer
            startCallTimer();
            
            // ✅ Avvia polling per sincronizzare screen share con l'altro utente
            startScreenSharePolling();
            
            // ✅ Carica messaggi precedenti e avvia polling chat
            await loadChatMessages();
            startChatPolling();
            
            // ⚠️ Recording è ora auto-avviato dal backend quando entrambi gli utenti si uniscono
            // Non è più necessario chiamare startRecording() dal frontend
            // await startRecording();
            
            loadingOverlay.style.display = 'none';
            
        } catch (error) {
            console.error('Error initializing call:', error);
            alert('Errore durante l\'inizializzazione della chiamata: ' + error.message);
            updateStatus('disconnected', 'Errore di connessione');
        }
    }
    
    // Handle remote user published
    async function handleUserPublished(user, mediaType) {
        remoteUsers[user.uid] = user;
        await client.subscribe(user, mediaType);
        
        if (mediaType === 'video') {
            remotePlayer.style.display = 'block';
            videoGrid.classList.add('has-remote');
            user.videoTrack.play('remotePlayer');
            remoteLabel.textContent = 'Partecipante';
            
            // Hide remote placeholder
            const remotePlaceholder = remotePlayer.querySelector('.video-placeholder');
            if (remotePlaceholder) {
                remotePlaceholder.style.display = 'none';
            }
        }
        
        if (mediaType === 'audio') {
            user.audioTrack.play();
        }
    }
    
    // Handle remote user unpublished
    function handleUserUnpublished(user, mediaType) {
        if (mediaType === 'video' && user.videoTrack) {
            user.videoTrack.stop();
        }
    }
    
    // Handle remote user left
    function handleUserLeft(user) {
        delete remoteUsers[user.uid];
        remotePlayer.style.display = 'none';
        videoGrid.classList.remove('has-remote');
    }

    async function startScreenShare() {
        try {
            // Crea screen track
            screenTrack = await AgoraRTC.createScreenVideoTrack({
                encoderConfig: "1080p_1",
                optimizationMode: "detail"
            });
            
            // Unpublish e ferma il video corrente
            if (localTracks.video) {
                await client.unpublish(localTracks.video);
                localTracks.video.stop();
                localTracks.video.close();
            }
            
            // Pubblica screen track
            await client.publish(screenTrack);
            
            // Mostra schermo nel video locale
            screenTrack.play('localPlayer');
            
            isScreenSharing = true;
            screenShareActive = true;
            
            // Aggiorna il layout per picture-in-picture
            videoGrid.classList.add('screen-sharing');
            
            // Notifica al backend che stai condividendo lo schermo
            try {
                await fetch(`/api/booking/${bookingId}/screen-share/start`, {
                    method: 'POST'
                });
                console.log('✅ Screen share notification sent to server');
            } catch (error) {
                console.error('⚠️ Errore notifica screen share:', error);
            }
            
            screenShareBtn.classList.add('active');
            screenShareBtn.querySelector('i').className = 'fas fa-desktop';
            
            // Quando l'utente ferma la condivisione dal browser
            screenTrack.on("track-ended", async () => {
                await stopScreenShare();
            });
            
        } catch (error) {
            console.error('Errore avvio screen share:', error);
            alert('Impossibile condividere lo schermo. Assicurati di dare i permessi necessari.');
        }
    }
    
    async function stopScreenShare() {
        try {
            if (screenTrack) {
                // Unpublish e ferma screen track
                await client.unpublish(screenTrack);
                screenTrack.stop();
                screenTrack.close();
                screenTrack = null;
            }
            
            // Ricrea e pubblica il video della webcam
            localTracks.video = await AgoraRTC.createCameraVideoTrack();
            await client.publish(localTracks.video);
            localTracks.video.play('localPlayer');
            
            isScreenSharing = false;
            screenShareActive = false;
            
            // Ripristina il layout normale
            videoGrid.classList.remove('screen-sharing');
            
            // Notifica al backend che hai smesso di condividere lo schermo
            try {
                await fetch(`/api/booking/${bookingId}/screen-share/stop`, {
                    method: 'POST'
                });
                console.log('✅ Screen share stop notification sent to server');
            } catch (error) {
                console.error('⚠️ Errore notifica stop screen share:', error);
            }
            
            screenShareBtn.classList.remove('active');
            screenShareBtn.querySelector('i').className = 'fas fa-desktop';
            
        } catch (error) {
            console.error('Errore stop screen share:', error);
        }
    }

    // Leave call
    async function leaveCall() {
        console.log('🔔 [LEAVE] leaveCall() called');
        
        // Stop screen share polling
        console.log('🔔 [LEAVE] Stopping screen share polling...');
        stopScreenSharePolling();
        
        // Stop chat polling
        console.log('🔔 [LEAVE] Stopping chat polling...');
        stopChatPolling();
        
        // Stop recording
        console.log('🔔 [LEAVE] Calling stopRecording()...');
        const recordingResult = await stopRecording();
        console.log('🔔 [LEAVE] stopRecording() returned:', recordingResult);
        
        // Stop timer
        if (timerInterval) {
            console.log('🔔 [LEAVE] Clearing timer...');
            clearInterval(timerInterval);
        }
        
        // Stop screen share if active
        if (screenTrack) {
            console.log('🔔 [LEAVE] Stopping screen track...');
            screenTrack.stop();
            screenTrack.close();
            screenTrack = null;
        }
        
        console.log('🔔 [LEAVE] Stopping local tracks...');
        for (let trackName in localTracks) {
            const track = localTracks[trackName];
            if (track) {
                track.stop();
                track.close();
            }
        }
        
        if (client) {
            console.log('🔔 [LEAVE] Leaving Agora channel...');
            await client.leave();
            console.log('🔔 [LEAVE] Left Agora channel');
        }
        
        // 🔔 Notify backend that user is leaving the booking
        console.log(`🔔 [LEAVE] Notifying backend that user is leaving booking ${bookingId}...`);
        try {
            const leaveResponse = await fetch(`/api/booking/${bookingId}/leave`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            console.log(`🔔 [LEAVE] Leave response status: ${leaveResponse.status}`);
            if (leaveResponse.ok) {
                const leaveData = await leaveResponse.json();
                console.log(`✅ [LEAVE] User left booking - still_has_participants: ${leaveData.still_has_participants}`);
            } else {
                console.warn(`⚠️ [LEAVE] Failed to notify leave: ${leaveResponse.status}`);
            }
        } catch (e) {
            console.error('❌ [LEAVE] Error notifying leave:', e);
        }
    }

    // ========== POLLING PER SINCRONIZZARE SCREEN SHARE STATE ==========
    
    /**
     * Controlla se l'altro utente sta condividendo lo schermo
     */
    async function checkRemoteScreenShareState() {
        try {
            const response = await fetch(`/api/booking/${bookingId}/screen-share/status`);
            if (!response.ok) return;
            
            const data = await response.json();
            
            // Se IO sto condividendo, non mi interessa cosa fa l'altro
            if (isScreenSharing) {
                return;
            }
            
            // Se l'altro utente sta condividendo e noi non abbiamo ancora aggiunto la classe
            if (data.is_remote_sharing && !remoteScreenShareActive) {
                console.log('📺 L\'altro utente sta condividendo lo schermo, aggiorno layout (inverted)');
                remoteScreenShareActive = true;
                videoGrid.classList.add('screen-sharing');
                videoGrid.classList.add('remote-sharing'); // ✅ Aggiungi classe per layout invertito
            }
            // Se l'altro utente ha smesso di condividere e noi avevamo aggiunto la classe
            else if (!data.is_remote_sharing && remoteScreenShareActive) {
                console.log('🎥 L\'altro utente ha smesso di condividere, ripristino layout');
                remoteScreenShareActive = false;
                videoGrid.classList.remove('screen-sharing');
                videoGrid.classList.remove('remote-sharing'); // ✅ Rimuovi classe layout invertito
            }
        } catch (error) {
            console.error('Errore check screen share state:', error);
        }
    }
    
    /**
     * Avvia polling dello screen share state
     */
    function startScreenSharePolling() {
        // Ferma polling precedente se esiste
        if (screenShareCheckInterval) {
            clearInterval(screenShareCheckInterval);
        }
        // Controlla ogni 500ms (mezzo secondo) per sincronizzazione veloce
        screenShareCheckInterval = setInterval(checkRemoteScreenShareState, 500);
        console.log('✅ Polling screen share state avviato');
    }
    
    /**
     * Ferma polling dello screen share state
     */
    function stopScreenSharePolling() {
        if (screenShareCheckInterval) {
            clearInterval(screenShareCheckInterval);
            screenShareCheckInterval = null;
        }
    }
    
    // ========== CHAT FUNCTIONS ==========
    
    /**
     * Visualizza un messaggio nella chat
     */
    function displayChatMessage(message, isOwn) {
        // Se è il primo messaggio, svuota il placeholder
        const isEmpty = chatUI.msgPanel.innerHTML.includes('Nessun messaggio') || chatUI.msgPanel.children.length === 0;
        if (isEmpty) {
            chatUI.msgPanel.innerHTML = '';
        }
        
        const messageDiv = document.createElement('div');
        messageDiv.className = `chat-message ${isOwn ? 'own' : ''}`;
        
        let html = `
            <span class="chat-message-sender">${message.user_name}</span>
            <span class="chat-message-text">${escapeHtml(message.message)}</span>
        `;
        
        // Aggiungi allegati se presenti
        if (message.attachments && message.attachments.length > 0) {
            html += '<div class="chat-message-attachments">';
            message.attachments.forEach(att => {
                // Estrai il nome file dal percorso
                const filename = att.file_path.split('/').pop() || att.filename;
                const encodedFilename = encodeURIComponent(filename);
                const downloadUrl = `/api/booking/${bookingId}/chat/download/${encodedFilename}`;
                
                html += `
                    <div class="chat-attachment">
                        <i class="fas fa-file"></i>
                        <a href="${downloadUrl}" download="${att.filename}" title="${att.filename}">
                            ${att.filename}
                        </a>
                        <span class="attachment-size">${formatFileSize(att.file_size)}</span>
                    </div>
                `;
            });
            html += '</div>';
        }
        
        messageDiv.innerHTML = html;
        chatUI.msgPanel.appendChild(messageDiv);
        
        // Scrolla in basso
        chatUI.msgPanel.scrollTop = chatUI.msgPanel.scrollHeight;
        
        console.log(`✅ Messaggio visualizzato: ${message.user_name} - ${message.message}`);
    }
    
    /**
     * Carica i messaggi precedenti della chat
     */
    async function loadChatMessages() {
        try {
            const response = await fetch(`/api/booking/${bookingId}/chat/messages`);
            if (!response.ok) return;
            
            const data = await response.json();
            chatUI.messagesCache = data.messages || [];
            
            // Visualizza tutti i messaggi
            chatUI.msgPanel.innerHTML = '';
            if (chatUI.messagesCache.length === 0) {
                chatUI.msgPanel.innerHTML = '<div style="color: #718096; font-size: 0.85rem; text-align: center; margin: auto; padding: 10px;">Nessun messaggio ancora</div>';
                return;
            }
            
            chatUI.messagesCache.forEach(msg => {
                displayChatMessage(msg, msg.user_id === {{ current_user.id }});
            });
        } catch (error) {
            console.error('❌ Errore caricamento messaggi:', error);
        }
    }
    
    /**
     * Invia un messaggio di chat con allegati
     */
    async function sendChatMessage() {
        // Protezione: evita invii multipli in rapida successione
        if (chatUI.isSending) {
            console.log('⏳ Invio già in corso, scartando richiesta duplicata');
            return;
        }
        
        const messageText = chatUI.input.value.trim();
        const hasAttachments = chatUI.attachments.length > 0;
        
        if (!messageText && !hasAttachments) return;
        
        chatUI.isSending = true;
        chatUI.sendBtn.disabled = true;
        chatUI.input.disabled = true;
        
        try {
            // Usa FormData se ci sono allegati, altrimenti usa JSON
            let body, headers;
            
            if (hasAttachments) {
                const formData = new FormData();
                formData.append('message', messageText);
                chatUI.attachments.forEach((file, idx) => {
                    formData.append(`attachment_${idx}`, file);
                });
                body = formData;
                headers = {}; // FormData aggiunge automaticamente il Content-Type corretto
            } else {
                body = JSON.stringify({ message: messageText });
                headers = { 'Content-Type': 'application/json' };
            }
            
            const response = await fetch(`/api/booking/${bookingId}/chat/send`, {
                method: 'POST',
                headers: headers,
                body: body
            });
            
            if (response.ok) {
                const message = await response.json();
                displayChatMessage(message, true);
                // Marca il messaggio come visualizzato per evitare che il polling lo mostri di nuovo
                displayedMessageIds.add(message.id);
                chatUI.input.value = '';
                clearAllAttachments();
                console.log('💬 Messaggio inviato:', messageText);
            } else {
                const error = await response.json();
                console.error('❌ Errore invio messaggio - Response status:', response.status);
                console.error('❌ Errore completo:', error);
                alert('Errore: ' + (error.detail || JSON.stringify(error)));
            }
        } catch (error) {
            console.error('❌ Errore send chat:', error);
            alert('Errore di connessione');
        } finally {
            chatUI.isSending = false;
            chatUI.sendBtn.disabled = false;
            chatUI.input.disabled = false;
            chatUI.input.focus();
        }
    }
    
    /**
     * Escapa HTML per evitare XSS
     */
    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
    }
    
    /**
     * Aggiorna il badge con il numero di messaggi non letti
     */
    function updateChatBadge() {
        if (chatUI.unreadCount > 0) {
            chatUI.badge.textContent = chatUI.unreadCount;
            chatUI.badge.style.display = 'flex';
        } else {
            chatUI.badge.style.display = 'none';
        }
    }
    
    /**
     * Polling per nuovi messaggi ogni 2 secondi
     */
    function startChatPolling() {
        // Inizializza displayedMessageIds con i messaggi già in cache (solo la prima volta)
        if (displayedMessageIds.size === 0) {
            chatUI.messagesCache.forEach(msg => {
                if (msg.id) displayedMessageIds.add(msg.id);
            });
        }
        
        chatPollInterval = setInterval(async () => {
            try {
                const response = await fetch(`/api/booking/${bookingId}/chat/messages`);
                if (!response.ok) {
                    console.error('❌ Errore polling chat, status:', response.status);
                    return;
                }
                
                const data = await response.json();
                const messages = data.messages || [];
                
                // Trova messaggi nuovi (quelli con ID non ancora visualizzato)
                const newMessages = messages.filter(msg => !displayedMessageIds.has(msg.id));
                
                if (newMessages.length > 0) {
                    console.log(`📬 ${newMessages.length} nuovi messaggi ricevuti`, newMessages);
                    
                    newMessages.forEach(msg => {
                        const isOwn = msg.user_id === {{ current_user.id }};
                        console.log(`📨 Visualizzando messaggio: id=${msg.id}, da=${msg.user_name}, isOwn=${isOwn}`);
                        
                        displayChatMessage(msg, isOwn);
                        displayedMessageIds.add(msg.id); // Marchia come visualizzato GLOBALMENTE
                        
                        // Aumenta conteggio non letti solo se la chat è chiusa e il messaggio è di un altro
                        if (!isOwn && chatUI.panel.style.display === 'none') {
                            chatUI.unreadCount++;
                            console.log(`🔔 Messaggi non letti: ${chatUI.unreadCount}`);
                            updateChatBadge();
                        }
                    });
                }
            } catch (error) {
                console.error('❌ Errore polling chat:', error);
            }
        }, 2000); // Controlla ogni 2 secondi
        
        console.log('✅ Chat polling avviato');
    }
    
    function stopChatPolling() {
        if (chatPollInterval) {
            clearInterval(chatPollInterval);
            chatPollInterval = null;
        }
    }
</script>
{% endblock %}
