name: ispiramy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ispiramy
      POSTGRES_PASSWORD: ispiramy
      POSTGRES_DB: ispiramy
    volumes:
      - ispiramy_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ispiramy -d ispiramy"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    # SMTP fake + webUI per leggere le email
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # WebUI: http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    volumes:
      - ispiramy_mailpit:/data

  minio:
    # S3-compatible storage locale + console webUI
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console: http://localhost:9001 (login: minio / minio12345)
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes:
      - ispiramy_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Crea automaticamente i bucket S3 alla prima avvio
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio12345;
      mc mb -p local/ispiramy-images || true;
      mc mb -p local/ispiramy-recordings || true;
      mc anonymous set download local/ispiramy-images || true;
      mc anonymous set download local/ispiramy-recordings || true;
      echo '✅ Bucket MinIO pronti';
      "

  web:
    build: .
    ports:
      - "10000:10000"
    environment:
      DATABASE_URL: postgresql://ispiramy:ispiramy@db:5432/ispiramy
      PORT: "10000"
      # S3 → MinIO locale
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
      AWS_S3_BUCKET_NAME: ispiramy-recordings
      S3_BUCKET_NAME: ispiramy-images
      AWS_S3_REGION: us-east-1
      AWS_REGION: us-east-1
      # Email → Mailpit locale (no TLS, no auth)
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASSWORD: smtp-placeholder
      SMTP_USE_TLS: "false"
      FROM_EMAIL: noreply@ispiramy.com
      EMAIL_FROM: Ispiramy <noreply@ispiramy.com>
      # Placeholder: in locale EMAIL_BACKEND=smtp ignora le chiavi SendGrid,
      # ma alcuni check in legacy code richiedono un valore non vuoto.
      SENDGRID_API_KEY: dev-only-placeholder
    env_file:
      - .env.local
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./uploads:/app/uploads
      - ./sql_update:/app/sql_update
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy

volumes:
  ispiramy_pgdata:
  ispiramy_mailpit:
  ispiramy_minio:
